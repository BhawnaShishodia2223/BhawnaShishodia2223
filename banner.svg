<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Bhawna Shishodia, Senior Consultant Data Science, Python Backend and AI Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F1F"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>

  <!-- Neural-network style decoration (left) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="70" y1="60" x2="160" y2="150"/>
    <line x1="160" y1="150" x2="250" y2="70"/>
    <line x1="160" y1="150" x2="120" y2="225"/>
    <line x1="250" y1="70" x2="330" y2="185"/>
    <line x1="160" y1="150" x2="330" y2="185"/>
    <line x1="70" y1="60" x2="250" y2="70"/>
  </g>
  <g fill="#99F6E4">
    <circle cx="70" cy="60" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="150" r="5"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="70" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="185" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="225" r="3.5"><animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Neural-network style decoration (right) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="1130" y1="55" x2="1040" y2="140"/>
    <line x1="1040" y1="140" x2="950" y2="65"/>
    <line x1="1040" y1="140" x2="1080" y2="220"/>
    <line x1="950" y1="65" x2="870" y2="180"/>
    <line x1="1040" y1="140" x2="870" y2="180"/>
    <line x1="1130" y1="55" x2="950" y2="65"/>
  </g>
  <g fill="#99F6E4">
    <circle cx="1130" cy="55" r="4"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="140" r="5"><animate attributeName="opacity" values="1;0.4;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="65" r="4"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="870" cy="180" r="4"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="220" r="3.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Text -->
  <text x="600" y="115" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">Bhawna Shishodia</text>
  <text x="600" y="158" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#E2E8F0">Senior Consultant • Data Science  |  Python Backend &amp; AI Engineer</text>
  <text x="600" y="198" text-anchor="middle" font-family="'JetBrains Mono', Consolas, 'Courier New', monospace" font-size="16" fill="#99F6E4">I build APIs that think &amp; AI that ships, safely.</text>
</svg>
